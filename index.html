<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Anatomy Mock Exams</title>
<style>
:root{--bg:#f6f7fb;--card:#fff;--tx:#1b2130;--mut:#5b6478;--bd:#d9deea;--ac:#2f5fd0;--ok:#1a8f4c;--okb:#e4f6ec;--no:#c8312f;--nob:#fdeaea;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#12151d;--card:#1b2030;--tx:#e8ebf4;--mut:#9aa3b8;--bd:#333b52;--ac:#7fa3ff;--ok:#4cd18a;--okb:#143324;--no:#ff7b78;--nob:#3a1b1d}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;line-height:1.5}
header{padding:10px 18px 2px;text-align:center}h1{margin:0;font-size:1rem;font-weight:700;letter-spacing:.3px}
nav{position:sticky;top:0;z-index:5;background:var(--bg);display:flex;gap:8px;overflow-x:auto;white-space:nowrap;padding:8px 20px;justify-content:safe center;border-bottom:1px solid var(--bd)}
nav button{flex:0 0 auto;border:1px solid var(--bd);background:var(--card);color:var(--tx);padding:6px 26px;min-width:96px;text-align:center;border-radius:7px;font-size:.88rem;font-weight:600;cursor:pointer;transition:background .2s,transform .15s}nav button:hover{transform:translateY(-1px)}
nav button[aria-selected=true]{background:var(--card);color:var(--ac);border-color:var(--ac);box-shadow:0 0 0 1px var(--ac),0 4px 12px rgba(47,95,208,.25)}nav button:hover{border-color:var(--ac)}
nav button:focus-visible,.opt:focus-visible{outline:3px solid var(--ac);outline-offset:2px}
main{max-width:860px;margin:0 auto;padding:16px 18px 60px}
.panel{display:none}.panel.on{display:block;animation:in .25s ease}
@keyframes in{from{opacity:0;transform:translateX(18px)}to{opacity:1;transform:none}}
.stats{background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:14px 16px;margin-bottom:16px;font-size:.92rem;box-shadow:0 4px 16px rgba(47,95,208,.08);animation:up .5s both}.sh{display:flex;justify-content:space-between;align-items:center;font-weight:700}.sti{font-size:1rem}.spc{color:var(--mut);font-weight:500}.spc b{color:var(--ac);font-size:1.1rem}.sg{display:grid;grid-template-columns:repeat(auto-fit,minmax(92px,1fr));gap:8px}.sc{background:var(--bg);border:1px solid var(--bd);border-radius:12px;padding:8px 6px;text-align:center;transition:transform .18s,box-shadow .18s,border-color .18s}.sc:hover{transform:translateY(-3px);box-shadow:0 6px 14px rgba(47,95,208,.15);border-color:var(--ac)}.sc b{display:block;font-size:1.4rem;line-height:1.2}.sc span{font-size:.76rem;color:var(--mut)}.sc.ok b{color:var(--ok)}.sc.bad b{color:var(--no)}.bump{animation:bump .5s cubic-bezier(.3,1.8,.5,1)}@keyframes bump{0%{transform:scale(1)}40%{transform:scale(1.6)}100%{transform:scale(1)}}
.bar{height:10px;background:var(--bd);border-radius:9px;margin:10px 0 12px;overflow:hidden}.bar i{display:block;position:relative;overflow:hidden;height:100%;background:linear-gradient(90deg,var(--ac),#3fcf8e);width:0;border-radius:9px;transition:width .6s cubic-bezier(.3,1,.4,1)}.bar i::after{content:"";position:absolute;top:0;bottom:0;width:40%;left:-40%;background:linear-gradient(90deg,transparent,rgba(255,255,255,.55),transparent);animation:shine 2s infinite}@keyframes shine{to{left:110%}}
.q{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:16px;margin-bottom:16px}
.meta{font-size:.8rem;color:var(--mut);margin-bottom:6px}.qt{font-size:1.1rem;font-weight:600;margin-bottom:12px}
.opt{display:flex;gap:10px;width:100%;text-align:left;margin:7px 0;padding:11px 13px;border:2px solid var(--bd);border-radius:10px;background:var(--card);color:var(--tx);font-size:1rem;cursor:pointer}
.opt:disabled{cursor:default;color:var(--tx)}.opt{align-items:center;border-radius:14px;transition:transform .18s,box-shadow .18s,border-color .18s,background .18s}.opt:not(:disabled):hover{transform:translateX(6px);border-color:var(--ac);box-shadow:0 4px 14px rgba(47,95,208,.2)}.opt:not(:disabled):active{transform:scale(.975)}.opt b{display:inline-flex;align-items:center;justify-content:center;flex:0 0 auto;min-width:30px;height:30px;border-radius:50%;background:var(--bg);border:1px solid var(--bd);font-size:.9rem;transition:background .2s,color .2s}.opt:not(:disabled):hover b{background:var(--ac);color:#fff;border-color:var(--ac)}.opt.ok b{background:var(--ok);color:#fff;border-color:var(--ok)}.opt.bad b{background:var(--no);color:#fff;border-color:var(--no)}.opt .mk{margin-left:auto;font-weight:700;font-size:1.2rem;animation:mk .5s cubic-bezier(.3,1.8,.5,1)}.opt.ok{animation:okpop .6s ease-out}.opt.bad{animation:shake .5s ease-in-out}.q{position:relative}.q.right{animation:flg .9s ease-out}.q.wrong{animation:flr .9s ease-out}.fb{animation:slide .4s ease-out}.fb h4{animation:mk .5s cubic-bezier(.3,1.8,.5,1);transform-origin:left}.panel.on .q{animation-name:up;animation-duration:.45s;animation-fill-mode:backwards}.panel.on .q:nth-child(3){animation-delay:.05s}.panel.on .q:nth-child(4){animation-delay:.1s}.panel.on .q:nth-child(5){animation-delay:.15s}.panel.on .q:nth-child(6){animation-delay:.2s}.pt{position:absolute;width:9px;height:9px;border-radius:2px;pointer-events:none;z-index:3;animation:fly .85s ease-out forwards}.res{position:relative;overflow:hidden}nav button:active,.fin button:active{transform:scale(.94)}nav button[aria-selected=true]{animation:tabpop .35s cubic-bezier(.3,1.6,.5,1)}.fin button{position:relative;overflow:hidden}.fin button::after{content:"";position:absolute;top:0;left:-70%;width:50%;height:100%;background:rgba(47,95,208,.18);transform:skewX(-20deg);transition:left .5s}.fin button:hover::after{left:130%}@keyframes okpop{0%{transform:scale(1)}40%{transform:scale(1.04);box-shadow:0 0 0 6px rgba(26,143,76,.35)}100%{transform:scale(1);box-shadow:0 0 0 0 rgba(26,143,76,0)}}@keyframes shake{0%,100%{transform:translateX(0)}15%{transform:translateX(-10px)}35%{transform:translateX(9px)}55%{transform:translateX(-7px)}75%{transform:translateX(5px)}}@keyframes flg{0%{box-shadow:0 0 0 0 rgba(26,143,76,.55)}100%{box-shadow:0 0 0 18px rgba(26,143,76,0)}}@keyframes flr{0%{box-shadow:0 0 0 0 rgba(200,49,47,.55)}100%{box-shadow:0 0 0 18px rgba(200,49,47,0)}}@keyframes slide{from{opacity:0;transform:translateY(-10px)}to{opacity:1;transform:none}}@keyframes mk{from{transform:scale(0) rotate(-90deg)}to{transform:scale(1) rotate(0)}}@keyframes up{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}@keyframes fly{to{transform:translate(var(--dx),var(--dy)) rotate(420deg);opacity:0}}@keyframes tabpop{from{transform:scale(.9)}to{transform:scale(1)}}@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
.opt.ok{border-color:var(--ok);background:var(--okb)}.opt.bad{border-color:var(--no);background:var(--nob)}
.fb{margin-top:12px;padding:12px 14px;border-radius:10px;border:1px solid var(--bd);font-size:.9rem;line-height:1.7}
.fb.ok{border-color:var(--ok)}.fb.bad{border-color:var(--no)}
.fb h4{margin:0 0 6px;font-size:.95rem}.fb.ok h4{color:var(--ok)}.fb.bad h4{color:var(--no)}
.ar{direction:rtl;text-align:right;margin-top:8px}.ar p{margin:5px 0}
.res{background:var(--card);border:2px solid var(--ac);border-radius:18px;padding:22px 18px 24px;margin-bottom:18px;display:none;text-align:center;box-shadow:0 6px 22px rgba(47,95,208,.15)}.fin h3{margin:6px 0 10px;font-size:1.4rem}.wheel{display:flex;justify-content:center}.wc{animation:wh .9s ease-out}@keyframes wh{from{stroke-dashoffset:326.7}}.chips{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-bottom:10px}.chips span{background:var(--bg);border:1px solid var(--bd);border-radius:99px;padding:5px 14px;font-size:.88rem}.wk{color:var(--mut);font-size:.92rem}
.fin button{border:2px solid var(--ac);background:var(--card);color:var(--ac);border-radius:99px;padding:10px 22px;margin:16px 6px 0;font-size:.98rem;font-weight:600;cursor:pointer;transition:transform .15s,box-shadow .15s,background .2s}.fin button:hover{transform:translateY(-2px);box-shadow:0 4px 12px rgba(47,95,208,.25)}.fin button[id^=rv]{background:var(--card);color:var(--ac)}.fin button[id^=rt]:hover{background:var(--okb)}
table{border-collapse:collapse;width:100%;font-size:.92rem}td,th{border:1px solid var(--bd);padding:7px 9px;text-align:left;vertical-align:top}th{background:var(--card)}
.tw{overflow-x:auto}
.rv-mem{position:relative;background:var(--card);border:1px solid var(--bd);border-radius:18px;padding:14px 16px 14px 18px;margin-bottom:14px;overflow:hidden;animation:up .5s .08s both}
.rv-mem::before{content:"";position:absolute;left:0;top:0;bottom:0;width:5px;background:linear-gradient(180deg,var(--no),#e08a00)}
.rv-mem-h{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.rv-mem-ico{display:grid;place-items:center;width:34px;height:34px;border-radius:11px;background:color-mix(in srgb,var(--no) 14%,var(--card));font-size:1rem;animation:rvpulse 2.4s ease-in-out infinite}
@keyframes rvpulse{0%,100%{box-shadow:0 0 0 0 rgba(200,49,47,.35)}50%{box-shadow:0 0 0 7px rgba(200,49,47,0)}}
.rv-mem-h strong{display:block;font-size:.95rem;color:var(--no);line-height:1.2}
.rv-mem-h small{display:block;font-size:.76rem;color:var(--mut)}
.rv-chips{display:flex;flex-wrap:wrap;gap:8px}
.rv-chip{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:.84rem;font-weight:600;border:1px solid var(--bd);background:var(--bg);border-radius:10px;padding:6px 12px;animation:rbpop .45s cubic-bezier(.3,1.5,.5,1) backwards;animation-delay:calc(var(--i,0)*.05s + .2s);transition:transform .2s,border-color .2s,color .2s,box-shadow .2s}
.rv-chip:hover{transform:translateY(-3px) rotate(-1deg);border-color:var(--no);color:var(--no);box-shadow:0 8px 16px rgba(200,49,47,.16)}
.rv-bar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:14px;padding:10px;background:var(--card);border:1px solid var(--bd);border-radius:16px;animation:up .5s .12s both}
#pr .rv-bar{scroll-margin-top:calc(var(--navh,78px) + 12px)}
.rv-sbox{position:relative;display:block;flex:1 1 200px;min-width:0}
.rv-sbox svg{position:absolute;left:12px;top:50%;width:16px;height:16px;transform:translateY(-50%);color:var(--mut);pointer-events:none;transition:color .2s,transform .3s cubic-bezier(.3,1.5,.5,1)}
.rv-sbox:focus-within svg{color:var(--ac);transform:translateY(-50%) scale(1.15)}
.rv-bar input{width:100%;padding:9px 12px 9px 36px;border:2px solid var(--bd);border-radius:11px;background:var(--bg);color:var(--tx);font:inherit;font-size:.92rem;transition:border-color .2s,box-shadow .2s,background .2s}
.rv-bar input:focus{outline:none;border-color:var(--ac);background:var(--card);box-shadow:0 0 0 4px rgba(47,95,208,.15)}
.rv-seg{display:flex;gap:3px;padding:3px;background:var(--bg);border:1px solid var(--bd);border-radius:12px;flex-wrap:wrap}
.rv-seg button{position:relative;isolation:isolate;overflow:hidden;display:inline-flex;align-items:center;gap:5px;font-family:inherit;font-size:.8rem;font-weight:600;color:var(--mut);background:transparent;border:none;border-radius:9px;padding:6px 10px 6px 11px;cursor:pointer;transition:color .25s,background .25s,box-shadow .25s,transform .25s cubic-bezier(.3,1.5,.5,1)}
.rv-seg button::before{content:"";position:absolute;inset:0;z-index:-1;background:linear-gradient(90deg,transparent,color-mix(in srgb,var(--ac) 16%,transparent),transparent);transform:translateX(-100%);transition:transform .55s ease}
.rv-seg button:hover{color:var(--tx);transform:translateY(-2px)}
.rv-seg button:hover::before{transform:translateX(100%)}
.rv-seg button:hover .rv-em{animation:rvwig .6s ease}
.rv-seg button:hover .rv-cnt{transform:scale(1.12)}
.rv-em{display:inline-block;font-size:.85rem;line-height:1}
.rv-cnt{display:inline-grid;place-items:center;min-width:22px;height:19px;padding:0 6px;border-radius:99px;background:var(--card);border:1px solid var(--bd);font-size:.68rem;font-weight:700;font-variant-numeric:tabular-nums;color:var(--mut);transition:background .25s,color .25s,border-color .25s,transform .25s cubic-bezier(.3,1.5,.5,1)}
.rv-cnt.tick{animation:rvtick .45s cubic-bezier(.3,1.6,.5,1)}
.rv-seg button.on .rv-cnt{background:var(--ac);border-color:var(--ac);color:#fff}
@keyframes rvwig{0%,100%{transform:rotate(0) scale(1)}25%{transform:rotate(-12deg) scale(1.18)}50%{transform:rotate(10deg) scale(1.18)}75%{transform:rotate(-5deg) scale(1.05)}}
@keyframes rvtick{0%{transform:scale(.55)}60%{transform:scale(1.2)}100%{transform:scale(1)}}
.rv-seg button:active{transform:scale(.93)}
.rv-seg button.on{background:var(--card);color:var(--ac);box-shadow:0 2px 8px rgba(47,95,208,.22);animation:rbpop .35s cubic-bezier(.3,1.5,.5,1)}
.rv-bar input{padding-right:34px}
.rv-clear{position:absolute;right:7px;top:50%;width:22px;height:22px;margin-top:-11px;display:grid;place-items:center;border:none;border-radius:50%;background:var(--mut);color:var(--card);font-size:.62rem;font-weight:800;line-height:1;cursor:pointer;opacity:0;transform:scale(.5) rotate(-90deg);pointer-events:none;transition:opacity .2s,transform .35s cubic-bezier(.3,1.5,.5,1),background .2s}
.rv-sbox.has .rv-clear{opacity:1;transform:none;pointer-events:auto}
.rv-clear:hover{background:var(--no)}
.rv-clear:active{transform:scale(.85)}
.rv-dd{position:relative;flex:0 1 220px;min-width:0;z-index:30}
.rv-dd-btn{width:100%;display:flex;align-items:center;gap:9px;font-family:inherit;font-size:.84rem;font-weight:600;color:var(--tx);background:var(--bg);border:2px solid var(--bd);border-radius:11px;padding:7px 12px;cursor:pointer;text-align:left;transition:border-color .25s,box-shadow .25s,transform .2s,background .25s}
.rv-dd-btn:hover{border-color:var(--ac);transform:translateY(-2px);box-shadow:0 6px 16px rgba(47,95,208,.14)}
.rv-dd-btn:active{transform:scale(.97)}
.rv-dd.open .rv-dd-btn{border-color:var(--ac);background:var(--card);box-shadow:0 0 0 4px rgba(47,95,208,.14)}
.rv-dd-lbl{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rv-dd-dot{flex:0 0 auto;width:9px;height:9px;border-radius:50%;background:var(--bd);transition:background .3s}
.rv-dd.active .rv-dd-dot{background:var(--ac);animation:rvdot 1.8s ease-in-out infinite}
@keyframes rvdot{0%,100%{box-shadow:0 0 0 0 rgba(47,95,208,.5)}50%{box-shadow:0 0 0 6px rgba(47,95,208,0)}}
.rv-dd-chev{flex:0 0 auto;width:15px;height:15px;color:var(--mut);transition:transform .35s cubic-bezier(.3,1.5,.5,1),color .2s}
.rv-dd.open .rv-dd-chev{transform:rotate(180deg);color:var(--ac)}
.rv-dd-menu{position:absolute;top:calc(100% + 8px);left:0;min-width:100%;width:max-content;max-width:min(330px,calc(100vw - 32px));display:flex;flex-direction:column;gap:2px;padding:6px;background:var(--card);border:1px solid var(--bd);border-radius:14px;box-shadow:0 18px 40px rgba(0,0,0,.18);opacity:0;visibility:hidden;transform:translateY(-8px) scale(.97);transform-origin:top center;transition:opacity .25s,transform .35s cubic-bezier(.3,1.4,.5,1),visibility .25s}
.rv-dd.open .rv-dd-menu{opacity:1;visibility:visible;transform:none}
.rv-dd-opt{position:relative;display:flex;align-items:center;gap:8px;font-family:inherit;font-size:.82rem;font-weight:600;color:var(--tx);background:transparent;border:none;border-radius:9px;padding:8px 10px 8px 14px;text-align:left;cursor:pointer;transition:background .2s,color .2s,transform .2s}
.rv-dd-opt::before{content:"";position:absolute;left:4px;top:25%;bottom:25%;width:3px;border-radius:3px;background:var(--ac);transform:scaleY(0);transition:transform .25s cubic-bezier(.3,1.5,.5,1)}
.rv-dd-opt b{flex:0 0 auto;font-size:.66rem;font-weight:800;color:var(--ac);background:color-mix(in srgb,var(--ac) 12%,var(--card));border-radius:6px;padding:2px 6px}
.rv-dd-opt:hover{background:color-mix(in srgb,var(--ac) 9%,var(--card));transform:translateX(4px)}
.rv-dd-opt:hover::before,.rv-dd-opt.on::before{transform:scaleY(1)}
.rv-dd-opt.on{color:var(--ac)}
.rv-dd.open .rv-dd-opt{animation:rvopt .4s cubic-bezier(.3,1.4,.5,1) backwards;animation-delay:calc(var(--i,0)*.03s + .04s)}
@keyframes rvopt{from{opacity:0;transform:translateX(-10px)}to{opacity:1;transform:none}}
.rv-ghost{font-family:inherit;font-size:.82rem;font-weight:600;color:var(--ac);background:var(--card);border:2px solid var(--bd);border-radius:11px;padding:7px 12px;cursor:pointer;transition:transform .15s,border-color .2s,background .2s}
.rv-ghost:hover{border-color:var(--ac);background:color-mix(in srgb,var(--ac) 9%,var(--card));transform:translateY(-2px)}
.rv-ghost:active{transform:scale(.95)}
.rv-empty{margin:4px 0 14px;padding:16px;text-align:center;color:var(--mut);border:2px dashed var(--bd);border-radius:14px;font-size:.92rem;animation:up .4s both}
.rv-sec{position:relative;background:var(--card);border:1px solid var(--bd);border-radius:18px;margin-bottom:14px;overflow:hidden;animation:up .5s var(--d,0s) both;transition:box-shadow .3s,border-color .3s}
.rv-sec::before{content:"";position:absolute;left:0;top:0;bottom:0;width:5px;background:hsl(var(--h,210) 72% 52%)}
.rv-sec:hover{border-color:hsl(var(--h,210) 60% 60%);box-shadow:0 12px 28px rgba(0,0,0,.08)}
.rv-sec summary{display:flex;align-items:center;gap:12px;padding:13px 16px 13px 20px;cursor:pointer;list-style:none;font-weight:700;user-select:none}
.rv-sec summary::-webkit-details-marker{display:none}
.rv-sec summary::after{content:"▾";margin-left:2px;font-size:1rem;color:var(--mut);transition:transform .3s cubic-bezier(.3,1.4,.5,1)}
.rv-sec:not([open]) summary::after{transform:rotate(-90deg)}
.rv-sec summary:focus-visible{outline:3px solid var(--ac);outline-offset:-3px}
.rv-ic{flex:0 0 auto;display:grid;place-items:center;width:38px;height:38px;border-radius:12px;background:color-mix(in srgb,hsl(var(--h,210) 72% 52%) 18%,var(--card));font-size:1.2rem;transition:transform .4s cubic-bezier(.3,1.5,.5,1)}
.rv-sec:hover .rv-ic{transform:rotate(-8deg) scale(1.08)}
.rv-st{flex:1;min-width:0;font-size:.98rem}
.rv-sl{flex:0 0 auto;font-size:.72rem;font-weight:600;color:var(--ac);background:color-mix(in srgb,hsl(var(--h,210) 72% 52%) 12%,var(--card));border-radius:99px;padding:3px 10px;white-space:nowrap}
.rv-n{flex:0 0 auto;font-size:.74rem;font-weight:600;color:var(--mut);font-variant-numeric:tabular-nums}
.rv-body{padding:0 14px 14px 18px;animation:slide .35s ease-out}
.rv-body ul{list-style:none;margin:0;padding:0}
.rv-row{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;margin:6px 0;border-radius:12px;border:1px solid var(--bd);border-left:4px solid var(--mut);background:var(--card);font-size:.93rem;line-height:1.8;animation:rvrow .45s cubic-bezier(.3,1.3,.5,1) backwards;animation-delay:calc(var(--k,0)*.035s);transition:transform .22s,background .22s,box-shadow .22s}
@keyframes rvrow{from{opacity:0;transform:translateX(-14px)}to{opacity:1;transform:none}}
.rv-row.l1{border-left-color:var(--no)}.rv-row.l2{border-left-color:#e08a00}.rv-row.l3{border-left-color:#8a4fd6}

.rv-tag{flex:0 0 auto;display:grid;place-items:center;width:28px;height:28px;border-radius:9px;font-size:.9rem;background:var(--bg);transition:transform .25s cubic-bezier(.3,1.5,.5,1)}
.l1 .rv-tag{background:color-mix(in srgb,var(--no) 14%,var(--card));animation:rvpulse 2.4s ease-in-out infinite}
.l2 .rv-tag{background:color-mix(in srgb,#e08a00 16%,var(--card))}
.l3 .rv-tag{background:color-mix(in srgb,#8a4fd6 16%,var(--card))}

.rv-tx{flex:1;min-width:0;text-align:right}

.rv-row:hover .rv-src{background:var(--ac);color:#fff;transform:translateY(-1px)}
.tw{overflow-x:auto;border-radius:14px;border:1px solid var(--bd);margin-top:10px}
.rv-t{width:100%;margin:0;font-size:.9rem;border-collapse:collapse}

tabs.addEventListener("keydown",e=>{const bs=[...tabs.children],k=bs.indexOf(document.activeElement);if(k<0)return;if(e.key=="ArrowRight"||e.key=="ArrowLeft"){const n=bs[(k+(e.key=="ArrowRight"?1:bs.length-1))%bs.length];n.focus();n.click()}});
EX.forEach((_,i)=>stats(i));show(0);
</script></body></html>
